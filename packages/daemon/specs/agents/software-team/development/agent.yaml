name: software-team-development
version: "1.0"
description: Resident implementation and corrective change owner

defaults:
  runtime: codex
  lifecycle:
    execution_mode: interactive_resident
    restore_policy: resume_if_possible

imports:
  - ref: local:../shared

profiles:
  default:
    uses:
      skills: [software-team-development, software-team-shared:software-team-contract]
      guidance: []
      subagents: []
      plugins: []
      runtime_resources: []

resources:
  skills:
    - id: software-team-development
      path: skills/software-team-development

startup:
  files:
    - path: skills/software-team-development/SKILL.md
      delivery_hint: send_text
      required: true
  actions: []
