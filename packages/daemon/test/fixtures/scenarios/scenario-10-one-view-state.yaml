# Scenario #10 — one-view-state consistency (the 5.1 crowning assertion).
#
# INTENT: at a single point in time the shipped surfaces must AGREE about one
# world. This is the automated form of the failure class that costs real time —
# one surface confidently reporting a world another surface cannot see.
#
# WHAT IS COMPARED, and why these two: `SoftwareTeam ps` and `SoftwareTeam queue` are both
# daemon-truth surfaces, so the software_teams ps reports and the software_teams the queue's items are
# destined for must be the SAME SET. A qitem addressed to a SoftwareTeam ps does not know
# about — or a software_team running with its queue work invisible — breaks this and fails
# the scenario. The declarative mapping below is what makes the comparison
# possible: the surfaces answer in different shapes (software_team records vs qitems whose
# destinationSession is <pod>-<member>@<software_team>), so each DECLARES the field carrying
# the shared truth. Per A-N1 the mapping is the only scenario-facing form; it
# lowers to the runner-internal seam.
#
# WHAT tui_socket CONTRIBUTES, stated honestly: its own coherence, asserted
# separately below — NOT membership in the equality. MEASURED at source: both of
# the control socket's OBSERVE verbs return UI/registry state
# (`state` -> {screen, drill, viewTab}; `commands` -> the command registry), so
# the shipped socket carries NO daemon truth to compare. Folding it into the
# equality could only pass by comparing something trivially equal, which would be
# a false green. The gap is a TUI finding (the state query would need to expose
# the software_team/queue view it renders), not something this scenario can paper over.
scenario: one-view-state-consistency
topology: ./topo-stub-baton.yaml
env:
  tui: true
  # give the queue a real item so both surfaces have a software_team to agree about; an
  # all-empty comparison would pass without proving anything
  queue:
    - id: view-1
      source: harness@scn-baton
      destination: dev-worker@scn-baton
      summary: "#10 one-view-state — the queue's software_team must be a SoftwareTeam ps knows"
      claim: true
steps:
  - up: {}
  # the TUI is live and coherent at this instant (its own state, its own claim)
  - expect:
      surface: tui_socket
      within: 20s
      match:
        ok: true
  # THE INVARIANT: ps and queue name the same software_team set
  - expect:
      surface: ps
      within: 20s
      equals:
        ps: { pluck: name }
        queue: { pluck: destinationSession, softwareTeam: true }
  - down: {}
