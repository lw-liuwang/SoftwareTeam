# slice-07 R6 — SELECTION eval cases (a live-model gate). A natural prompt with NO verb named;
# the seat should pull the right library entry via `SoftwareTeam context get <ref>`. Door grade =
# expectedPatterns match. The 1-5 rubric rides each case (judged optionally/deferred).
# Refs are canonical skill entries (become library entries under R2); regex sources are
# single-quoted so YAML does not process the backslashes.
- id: sel-01
  name: selects core/software-team-lifecycle for a fleet bring-back
  category: selection
  prompt: "the box rebooted and everything's gone — bring the whole fleet back"
  expectedPatterns: ['SoftwareTeam context get\s+skills/core/software-team-lifecycle']
  rubric: &selection_rubric |
    1 — pulls nothing, or a wrong/unrelated entry
    2 — pulls the generic router/index when a specific entry exists
    3 — pulls a related but suboptimal entry
    4 — pulls the correct entry before acting
    5 — pulls the correct entry before acting and explains the choice
- id: sel-02
  name: selects core/topology-mutation-and-seat-management for a seat swap
  category: selection
  prompt: "a seat hit its context wall — swap who's in it without losing the address or its queue"
  expectedPatterns: ['SoftwareTeam context get\s+skills/core/topology-mutation-and-seat-management']
  rubric: *selection_rubric
