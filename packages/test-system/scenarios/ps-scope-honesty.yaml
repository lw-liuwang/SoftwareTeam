# Defect class: the across-software_teams trap (`SoftwareTeam ps` scope honesty).
# Marathon origin: `SoftwareTeam ps` silently mixed seats from other software_teams into the current-software_team
#   view (or hid them), so operators mis-read who was running where.
# SEED (class: across-software-teams-leak): the seeded regression leaks software-team-beta's seats into
#   software-team-alpha's DEFAULT (current-software_team) ps view. The default-scope `expect ps` MUST catch
#   it — beta is UP but must be ABSENT from alpha's default; the diff shows expected
#   {only software-team-alpha} vs an observed alpha+beta, naming the leak.
#
# V1 SHAPE (endorsed, dev-driver + orch 2026-08-06): assert the current-software-team-DEFAULT leg
# LIVE (honest, shipped: default `SoftwareTeam ps` is current-software_team). The all-software_teams / per-software_team
# confirmatory legs (`ps --nodes -A` / `ps --nodes --software_team <name>`) are R-16 VISIBLY-
# DEFERRED: the daemon may SILENTLY IGNORE the scope selector in its projection, so
# asserting them now risks a FALSE GREEN (selector dropped). They light up when R-16
# honors the selector end-to-end (pooled accept-and-drop instance #3, family trending to
# a systematic accept-vs-honor sweep at conversion).
# Deps: R-12 (multi-software_team `up` — the second software_team must actually come up for the leak-catch to
#   be real, not a trivial-absent false green); R-16 (the deferred scoped legs).
scenario: ps-scope-honesty
topology: ./software-team-alpha-stub.yaml
steps:
  - up: {}
  - up: {topology: ./software-team-beta-stub.yaml}   # R-12: bring up the second software_team (dep)
  # DEFAULT ps = current software_team only: software-team-beta is UP but ABSENT from software-team-alpha's default
  # view. (Exact `SoftwareTeam ps --json` field shape verifies-at-source in the runtime pass.)
  - expect:
      surface: ps
      within: 20s
      # ps default = BARE ARRAY of per-software_team PsEntry {name,status,runningCount,...};
      # software-team-alpha present, software-team-beta absent (the leak-catch). Per-seat detail = --nodes.
      match:
        - name: software-team-alpha
          status: running
  # DEFERRED (R-16, VISIBLY annotated, NOT dropped) — the confirmatory scoped legs:
  #   `ps --nodes -A` shows alpha+beta (the honest cross-software_team widening); `ps --nodes
  #   --software_team software-team-beta` shows beta only. Held until the daemon honors the scope selector
  #   in its projection (else the selector is silently dropped = false green).
  - seed_regression: {class: across-software-teams-leak}
  - down: {}
