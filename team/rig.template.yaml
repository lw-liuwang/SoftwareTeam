version: "0.2"
name: software-team
summary: One resident software team for this OpenRig repository
workspace:
  workspace_root: ..
  repos:
    - name: software-team
      path: ..
      kind: project
  default_repo: software-team
  knowledge_root: knowledge
startup:
  files:
    - path: PROJECT.md
      delivery_hint: send_text
      required: true
pods:
  - id: team
    label: Software Team
    members:
      - id: coordinator
        role: coordinator
        agent_ref: local:../packages/daemon/specs/agents/software-team/coordinator
        profile: default
        cwd: workspaces/coordinator
      - id: requirements
        role: requirements
        agent_ref: local:../packages/daemon/specs/agents/software-team/requirements
        profile: default
        cwd: workspaces/requirements
      - id: architecture
        role: architecture
        agent_ref: local:../packages/daemon/specs/agents/software-team/architecture
        profile: default
        cwd: workspaces/architecture
      - id: development
        role: development
        agent_ref: local:../packages/daemon/specs/agents/software-team/development
        profile: default
        cwd: workspaces/development
      - id: review
        role: review
        agent_ref: local:../packages/daemon/specs/agents/software-team/review
        profile: default
        cwd: workspaces/review
      - id: testing
        role: testing
        agent_ref: local:../packages/daemon/specs/agents/software-team/testing
        profile: default
        cwd: workspaces/testing
      - id: operations
        role: operations
        agent_ref: local:../packages/daemon/specs/agents/software-team/operations
        profile: default
        cwd: workspaces/operations
    edges:
      - {kind: delegates_to, from: coordinator, to: requirements}
      - {kind: delegates_to, from: coordinator, to: architecture}
      - {kind: delegates_to, from: coordinator, to: development}
      - {kind: delegates_to, from: coordinator, to: review}
      - {kind: delegates_to, from: coordinator, to: testing}
      - {kind: delegates_to, from: coordinator, to: operations}
edges: []
